services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: anomalias
      MYSQL_USER: anomalias_app
      MYSQL_PASSWORD: anomalias_local
      MYSQL_ROOT_PASSWORD: root_local
      TZ: UTC
    ports:
      - "127.0.0.1:3317:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01-inicializar.sql:/docker-entrypoint-initdb.d/01-inicializar.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
