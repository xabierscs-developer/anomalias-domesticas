spring:
  application:
    name: anomalias-domesticas
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3317/anomalias?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:anomalias_app}
    password: ${DB_PASSWORD:anomalias_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
